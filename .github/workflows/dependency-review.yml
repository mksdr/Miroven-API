name: Dependency Review

on:
  push:
    branches: [main]
  # A base-branch workflow and write token are needed to submit fork/Dependabot
  # snapshots. Only uv.lock is downloaded; never check out or execute PR code.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uv-snapshots:
    name: Submit uv snapshot (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request_target' && '["base", "head"]' || '["head"]') }}
    steps:
      - name: Download only the lockfile
        uses: actions/github-script@v8
        env:
          SNAPSHOT_SHA: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'uv.lock',
              ref: process.env.SNAPSHOT_SHA,
            });
            if (data.type !== 'file' || data.encoding !== 'base64' || !data.content) {
              throw new Error('Expected a non-empty, regular uv.lock file');
            }
            require('node:fs').writeFileSync('uv.lock', Buffer.from(data.content, 'base64'));
      - name: Submit Python dependencies
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
        with:
          detectorsFilter: UvLock
          detectorArgs: UvLock=EnableIfDefaultOff
          correlator: uv-lock
          snapshot-sha: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          snapshot-ref: ${{ github.event_name == 'pull_request_target' && (matrix.revision == 'base' && format('refs/heads/{0}', github.event.pull_request.base.ref) || format('refs/pull/{0}/head', github.event.pull_request.number)) || github.ref }}
      - name: Require detected Python dependencies
        run: jq -e '.componentsFound | length > 0' output.json > /dev/null

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request_target'
    needs: uv-snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
