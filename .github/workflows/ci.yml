name: API checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: miroven
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: miroven_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miroven -d miroven_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://miroven:ci_test_password@127.0.0.1:5432/miroven_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: uv run ruff check app scripts tests migrations
      - run: uv run ruff format --check app scripts tests migrations
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py --check
      - run: npm ci
      - run: npm run generate && npm run typecheck
      - run: git diff --exit-code -- contracts
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t miroven-api:ci .
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: uv run python scripts/smoke_compose.py
      - run: uv run python scripts/smoke_account.py --restart-worker
      - if: failure()
        run: docker compose logs --tail 50
      - if: always()
        run: docker compose down
