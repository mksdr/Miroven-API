name: API checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: miroven
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: miroven_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miroven -d miroven_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://miroven:ci_test_password@127.0.0.1:5432/miroven_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python .github/scripts/release_policy.py
      - run: uv run ruff check app scripts tests migrations deploy/truenas/manage.py
      - run: uv run ruff format --check app scripts tests migrations deploy/truenas/manage.py
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py --check
      - run: npm ci
      - run: npm run generate && npm run typecheck
      - run: git diff --exit-code -- contracts
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker build -t miroven-api:ci .
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: uv run python scripts/smoke_compose.py
      - run: uv run python scripts/smoke_account.py --restart-worker
      - if: failure()
        run: docker compose logs --tail 50
      - if: always()
        run: docker compose down
  publish:
    # A stable version tag is the explicit production release trigger.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [verify, compose-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: api-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable version
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 .github/scripts/release_policy.py --tag "$RELEASE_TAG"
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
      - name: Inspect existing release for safe retries
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/api_release.py inspect
      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.published != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.published != 'true'
      - uses: docker/login-action@v3
        if: steps.existing.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested image
        if: steps.existing.outputs.published != 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Publish release after its descriptor is uploaded
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/api_release.py publish
