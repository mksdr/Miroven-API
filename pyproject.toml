[project]
name = "miroven-api"
version = "0.1.0"
description = "Self-hostable encrypted sync service for Miroven"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
authors = [
    { name = "Miroven Project" },
]
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.118",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.161.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[project.urls]
Homepage = "https://github.com/mksdr/Miroven"
Repository = "https://github.com/mksdr/Miroven-API"
Documentation = "https://github.com/mksdr/Miroven/wiki"
Issues = "https://github.com/mksdr/Miroven/issues"

[dependency-groups]
dev = [
    "aiosmtpd==1.4.6",
    "httpx==0.28.1",
    "moto[s3]==5.2.4",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated TEST_DATABASE_URL PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
